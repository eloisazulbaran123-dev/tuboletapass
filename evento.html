<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Evento - TuBoleta</title>
  <link rel="stylesheet" href="/src/styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    .event-page { padding-top: 1rem; }
    .event-header { background: var(--blue); padding: 1rem 0; position: sticky; top: 0; z-index: 100; }
    .event-header .container { display: flex; align-items: center; justify-content: space-between; }
    .back-btn { display: flex; align-items: center; gap: 0.5rem; color: var(--white); font-weight: 500; text-decoration: none; }
    .back-btn:hover { color: var(--cyan); }
    .event-hero { position: relative; height: 300px; overflow: hidden; }
    .event-hero img { width: 100%; height: 100%; object-fit: cover; }
    .event-details { padding: 2rem 0; }
    .event-grid { display: grid; grid-template-columns: 1fr; gap: 2rem; }
    .event-info h1 { font-size: 1.75rem; font-weight: 800; color: var(--blue); margin-bottom: 1rem; }
    .event-meta { display: flex; flex-wrap: wrap; gap: 1.5rem; margin-bottom: 1.5rem; }
    .event-meta-item { display: flex; align-items: center; gap: 0.5rem; color: var(--text-light); font-size: 0.9rem; }
    .event-description { color: var(--text-light); line-height: 1.8; margin-bottom: 2rem; }
    
    /* Selector de localidades */
    .localities-section { background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow); padding: 1.5rem; }
    .localities-section h3 { font-size: 1.1rem; font-weight: 700; color: var(--blue); margin-bottom: 1rem; }
    .localities-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
    .locality-card { border: 2px solid var(--border); border-radius: 10px; padding: 1rem; cursor: pointer; transition: all 0.2s; position: relative; }
    .locality-card:hover { border-color: var(--cyan); transform: translateY(-2px); }
    .locality-card.selected { border-color: var(--cyan); background: rgba(0, 180, 216, 0.05); }
    .locality-card.sold-out { opacity: 0.5; cursor: not-allowed; }
    .locality-card.sold-out:hover { transform: none; }
    .locality-color { width: 100%; height: 80px; border-radius: 8px; margin-bottom: 0.75rem; }
    .locality-name { font-weight: 600; color: var(--blue); margin-bottom: 0.5rem; }
    .locality-price { font-weight: 700; color: var(--cyan); font-size: 1.1rem; }
    .locality-availability { font-size: 0.75rem; color: var(--text-light); margin-top: 0.25rem; }
    .sold-out-label { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(239, 68, 68, 0.9); color: white; padding: 0.5rem 1rem; border-radius: 20px; font-weight: 700; font-size: 0.8rem; }
    
    /* Selector de cantidad */
    .quantity-section { border-top: 1px solid var(--border); padding-top: 1.5rem; margin-top: 1.5rem; }
    .quantity-controls { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; }
    .quantity-label { font-weight: 600; color: var(--blue); }
    .quantity-btns { display: flex; align-items: center; gap: 1rem; }
    .quantity-btn { width: 40px; height: 40px; border-radius: 8px; border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 1.25rem; color: var(--blue); background: var(--white); cursor: pointer; font-weight: 700; }
    .quantity-btn:hover { background: var(--gray); border-color: var(--cyan); }
    .quantity-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .quantity-value { font-size: 1.5rem; font-weight: 800; color: var(--blue); min-width: 50px; text-align: center; }
    
    /* Total */
    .total-section { background: var(--gray); border-radius: 10px; padding: 1.25rem; }
    .total-row { display: flex; justify-content: space-between; margin-bottom: 0.75rem; color: var(--text-light); font-size: 0.95rem; }
    .total-row.final { font-size: 1.25rem; font-weight: 800; color: var(--blue); margin-top: 1rem; padding-top: 1rem; border-top: 2px solid var(--border); }
    .total-row.final span:last-child { color: var(--cyan); }
    .buy-btn { width: 100%; padding: 1rem; background: linear-gradient(135deg, var(--yellow) 0%, #f57f17 100%); border: none; border-radius: 10px; color: white; font-size: 1rem; font-weight: 700; cursor: pointer; margin-top: 1rem; }
    .buy-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(249,168,37,0.4); }
    .buy-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    
    .loading { text-align: center; padding: 3rem; color: var(--text-light); }
    .no-localities { text-align: center; padding: 2rem; color: var(--text-light); background: var(--gray); border-radius: 10px; }
    
    /* ============================================
       SECCIÓN DEL PLANO DEL EVENTO (NUEVO)
       ============================================ */
    .event-venue-map {
      margin-top: 2rem;
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1.5rem;
    }
    
    .event-venue-map h3 {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--blue);
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    
    .venue-map-container {
      width: 100%;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    
    .venue-map-container img {
      width: 100%;
      height: auto;
      display: block;
    }
    /* ============================================ */
    
    /* Badge de descuento en imagen */
    .event-discount-badge {
      position: absolute;
      top: 1.5rem;
      right: 1.5rem;
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      color: white;
      padding: 0.75rem 1.5rem;
      border-radius: 30px;
      font-size: 1.5rem;
      font-weight: 800;
      box-shadow: 0 4px 16px rgba(239, 68, 68, 0.4);
      z-index: 10;
    }
    
    @media (min-width: 768px) {
      .event-grid { grid-template-columns: 1fr 420px; }
      .event-hero { height: 400px; }
      .event-info h1 { font-size: 2.25rem; }
    }
    
    @media (max-width: 768px) {
      .event-discount-badge {
        font-size: 1.25rem;
        padding: 0.5rem 1rem;
        top: 1rem;
        right: 1rem;
      }
    }
  </style>
</head>
<body>
  <header class="event-header">
    <div class="container">
      <a href="/" class="back-btn">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <path d="M12.5 15L7.5 10L12.5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Volver
       <a href="/" class="logo">
  <img src="public/logos/tuboleta-logo.png" alt="Tuboleta" style="height:35px;width:auto;" />
</a>
    </div>
  </header>

  <div id="eventContent" class="loading">
    Cargando evento...
  </div>

  <script type="module">
    import { eventsApi, ticketsApi, formatPrice, eventDatesApi, calculateDiscount, getDiscountBadgeText } from '/src/supabase.ts';

    const urlParams = new URLSearchParams(window.location.search);
    const eventId = parseInt(urlParams.get('id'));

    let event = null;
    let tickets = [];
    let selectedTicket = null;
    let quantity = 1;
    let selectedDate = null;
    let availableDates = [];

    async function loadEvent() {
      try {
        if (!eventId) {
          alert('ID de evento no válido');
          window.location.href = '/';
          return;
        }

        event = await eventsApi.getById(eventId);
        
        if (!event) {
          alert('Evento no encontrado');
          window.location.href = '/';
          return;
        }

        // Cargar fechas si la API está disponible
        try {
          availableDates = await eventDatesApi.getByEventId(eventId);
        } catch (error) {
          console.log('No hay fechas múltiples');
          availableDates = [];
        }

        // Cargar tickets
        try {
          tickets = await ticketsApi.getByEventId(eventId);
          console.log('Tickets cargados:', tickets);
        } catch (error) {
          console.error('Error al cargar tickets:', error);
          tickets = [];
        }

        renderEvent();
        renderDatesIfMultiple();
        renderTickets();

      } catch (error) {
        console.error('Error al cargar evento:', error);
        document.getElementById('eventContent').innerHTML = `
          <div style="text-align:center;padding:3rem;">
            <p style="color:#ef4444;font-size:1.1rem;">Error al cargar el evento</p>
            <a href="/" style="color:var(--cyan);text-decoration:none;margin-top:1rem;display:inline-block;">← Volver al inicio</a>
          </div>
        `;
      }
    }

    function renderEvent() {
      document.title = event.title + ' - TuBoleta';

      // Badge de descuento
      let discountBadge = '';
      if (event.has_discount) {
        try {
          const badgeText = getDiscountBadgeText(event.discount_type || 'percentage', event.discount_value || 0);
          discountBadge = `
            <div style="position:absolute;top:1.5rem;right:1.5rem;background:linear-gradient(135deg,#ef4444,#dc2626);color:white;padding:0.75rem 1.5rem;border-radius:30px;font-size:1.5rem;font-weight:800;box-shadow:0 4px 16px rgba(239,68,68,0.4);z-index:10;">
              ${badgeText}
            </div>
          `;
        } catch (e) {
          console.log('Error generando badge');
        }
      }

      const html = `
        <div class="event-hero" style="position:relative;">
          ${discountBadge}
          <img src="${event.image}" alt="${event.title}">
        </div>

        <section class="event-details">
          <div class="container">
            <div class="event-grid">
              <div class="event-info">
                <h1>${event.title}</h1>
                <div class="event-meta">
                  <div class="event-meta-item">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                      <path d="M6.667 1.667v2.5M13.333 1.667v2.5M2.917 7.5h14.166M4.167 3.333h11.666c.92 0 1.667.746 1.667 1.667v11.667c0 .92-.746 1.666-1.667 1.666H4.167c-.92 0-1.667-.746-1.667-1.666V5c0-.92.746-1.667 1.667-1.667z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <span>${event.date_full}</span>
                  </div>
                  <div class="event-meta-item">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                      <path d="M10 17.5a7.5 7.5 0 100-15 7.5 7.5 0 000 15z" stroke="currentColor" stroke-width="1.5"/>
                      <path d="M10 5v5l3.333 1.667" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                    <span>${event.time}</span>
                  </div>
                  <div class="event-meta-item">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                      <path d="M17.5 8.333c0 5.834-7.5 10-7.5 10s-7.5-4.166-7.5-10a7.5 7.5 0 1115 0z" stroke="currentColor" stroke-width="1.5"/>
                      <path d="M10 10.833a2.5 2.5 0 100-5 2.5 2.5 0 000 5z" stroke="currentColor" stroke-width="1.5"/>
                    </svg>
                    <span>${event.venue} - ${event.city}</span>
                  </div>
                </div>
                ${event.description ? `<p class="event-description">${event.description}</p>` : ''}
                
                ${event.venue_map ? `
                  <div class="event-venue-map">
                    <h3 style="display:flex;align-items:center;gap:0.5rem;font-size:1.1rem;font-weight:700;color:var(--blue);margin-bottom:1rem;">
                      <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                        <path d="M17.5 8.333c0 5.834-7.5 10-7.5 10s-7.5-4.166-7.5-10a7.5 7.5 0 1115 0z" stroke="currentColor" stroke-width="1.5"/>
                        <path d="M10 10.833a2.5 2.5 0 100-5 2.5 2.5 0 000 5z" stroke="currentColor" stroke-width="1.5"/>
                      </svg>
                      Plano del Evento
                    </h3>
                    <div class="venue-map-container" onclick="openMapModal()" style="position:relative;cursor:zoom-in;border-radius:10px;overflow:hidden;border:1px solid var(--border);">
                      <img src="${event.venue_map}" alt="Plano de ${event.venue}" loading="lazy" style="width:100%;height:auto;display:block;">
                      <div style="position:absolute;bottom:1rem;right:1rem;background:rgba(26,58,74,0.9);color:white;padding:0.5rem 1rem;border-radius:8px;font-size:0.875rem;pointer-events:none;">
                        🔍 Click para ampliar
                      </div>
                    </div>
                  </div>
                ` : ''}
              </div>

              <div>
                <div id="dates-selector-container"></div>
                
                <div class="localities-section">
                  <h3>Selecciona una localidad</h3>
                  <p style="font-size: 0.85rem; color: var(--text-light); margin-bottom: 1rem;">
                    Elige tu ubicación preferida
                  </p>
                  <div class="localities-grid" id="localitiesGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1rem;margin-bottom:1.5rem;">
                  </div>
                  
                  <div class="quantity-section" id="quantitySection" style="display:none;border-top:1px solid var(--border);padding-top:1.5rem;margin-top:1.5rem;">
                    <div class="quantity-controls">
                      <span class="quantity-label">Cantidad</span>
                      <div class="quantity-btns">
                        <button class="quantity-btn" onclick="decreaseQuantity()">−</button>
                        <span class="quantity-value" id="quantityValue">1</span>
                        <button class="quantity-btn" onclick="increaseQuantity()">+</button>
                      </div>
                    </div>
                    
                    <div class="total-section">
                      <div class="total-row">
                        <span>Subtotal</span>
                        <span id="subtotal">$0</span>
                      </div>
                      <div class="total-row">
                        <span>Servicio (10%)</span>
                        <span id="fee">$0</span>
                      </div>
                      <div class="total-row final">
                        <span>Total</span>
                        <span id="total">$0</span>
                      </div>
                    </div>
                    
                    <button class="buy-btn" onclick="proceedToBuy()" disabled id="buyBtn">
                      Comprar boletas
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </section>

        ${event.venue_map ? `
          <div id="mapModal" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.95);z-index:10000;align-items:center;justify-content:center;padding:2rem;" onclick="closeMapModal()">
            <div style="position:relative;max-width:90vw;max-height:90vh;" onclick="event.stopPropagation()">
              <button onclick="closeMapModal()" style="position:absolute;top:-3rem;right:0;background:white;border:none;width:40px;height:40px;border-radius:50%;cursor:pointer;font-size:1.5rem;color:var(--blue);transition:all 0.2s;">×</button>
              <img src="${event.venue_map}" alt="Plano del evento" style="max-width:100%;max-height:90vh;border-radius:8px;">
            </div>
          </div>
        ` : ''}
      `;

      document.getElementById('eventContent').innerHTML = html;
    }

    function renderDatesIfMultiple() {
      if (!availableDates || availableDates.length <= 1) return;

      const container = document.getElementById('dates-selector-container');
      if (!container) return;

      const datesHTML = `
        <div style="background:white;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,0.08);padding:1.5rem;margin-bottom:2rem;">
          <h3 style="font-size:1.1rem;font-weight:700;color:var(--blue);margin-bottom:1rem;">📅 Selecciona una fecha</h3>
          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1rem;">
            ${availableDates.map((date, index) => {
              const dateObj = new Date(date.event_date + 'T00:00:00');
              const day = dateObj.getDate();
              const month = dateObj.toLocaleDateString('es-ES', { month: 'short' }).toUpperCase();
              
              return `
                <div class="date-option" data-date-id="${date.id}" onclick="selectDate(${date.id})" 
                     style="border:2px solid ${index === 0 ? 'var(--cyan)' : 'var(--border)'};background:${index === 0 ? 'rgba(0,180,216,0.05)' : 'white'};border-radius:12px;padding:1rem;cursor:pointer;text-align:center;transition:all 0.3s;">
                  <div style="font-size:1.75rem;font-weight:800;color:var(--blue);line-height:1;">${day}</div>
                  <div style="font-size:0.875rem;font-weight:600;color:var(--cyan);margin-top:0.25rem;">${month}</div>
                  <div style="font-size:0.875rem;color:#666;margin-top:0.5rem;">⏰ ${date.event_time}</div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;

      container.innerHTML = datesHTML;
      
      if (availableDates.length > 0) {
        selectedDate = availableDates[0];
        loadTicketsByDate(availableDates[0].id);
      }
    }

    window.selectDate = async function(dateId) {
      selectedDate = availableDates.find(d => d.id === dateId);
      
      document.querySelectorAll('.date-option').forEach(el => {
        if (el.dataset.dateId == dateId) {
          el.style.borderColor = 'var(--cyan)';
          el.style.background = 'rgba(0,180,216,0.05)';
        } else {
          el.style.borderColor = 'var(--border)';
          el.style.background = 'white';
        }
      });

      await loadTicketsByDate(dateId);
    };

    async function loadTicketsByDate(dateId) {
      try {
        tickets = await ticketsApi.getByEventDateId(dateId);
        renderTickets();
      } catch (error) {
        console.error('Error cargando tickets por fecha:', error);
      }
    }

    function renderTickets() {
      const container = document.getElementById('localitiesGrid');
      if (!container) return;

      if (!tickets || tickets.length === 0) {
        container.innerHTML = '<div style="text-align:center;padding:2rem;color:var(--text-light);background:var(--gray);border-radius:10px;">No hay localidades disponibles</div>';
        return;
      }

      const colors = {
        'General': 'linear-gradient(135deg, #60a5fa 0%, #3b82f6 100%)',
        'VIP': 'linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%)',
        'Platea': 'linear-gradient(135deg, #a78bfa 0%, #8b5cf6 100%)',
        'Preferencial': 'linear-gradient(135deg, #34d399 0%, #10b981 100%)'
      };

      container.innerHTML = tickets.map(ticket => {
        const isSoldOut = ticket.available === 0;
        const availabilityPercent = Math.round((ticket.available / ticket.quantity) * 100);
        const color = colors[ticket.type] || 'linear-gradient(135deg, #94a3b8 0%, #64748b 100%)';
        
        let priceHTML = '';
        if (ticket.has_discount) {
          try {
            const result = calculateDiscount(ticket.price, ticket.discount_type || 'percentage', ticket.discount_value || 0);
            const badgeText = ticket.discount_type === 'percentage' ? `-${Math.round(ticket.discount_value)}%` : 'PROMO';
            
            priceHTML = `
              <div style="margin-bottom:0.5rem;">
                <div style="font-size:0.85rem;color:#999;text-decoration:line-through;margin-bottom:0.25rem;">${formatPrice(result.originalPrice)}</div>
                <div style="display:flex;align-items:center;gap:0.5rem;">
                  <span style="font-weight:700;color:var(--cyan);font-size:1.1rem;">${formatPrice(result.finalPrice)}</span>
                  <span style="background:linear-gradient(135deg,#ef4444,#dc2626);color:white;padding:0.25rem 0.5rem;border-radius:12px;font-size:0.7rem;font-weight:700;">${badgeText}</span>
                </div>
              </div>
            `;
          } catch (e) {
            priceHTML = `<div style="font-weight:700;color:var(--cyan);font-size:1.1rem;margin-bottom:0.5rem;">${formatPrice(ticket.price)}</div>`;
          }
        } else {
          priceHTML = `<div style="font-weight:700;color:var(--cyan);font-size:1.1rem;margin-bottom:0.5rem;">${formatPrice(ticket.final_price || ticket.price)}</div>`;
        }

        return `
          <div class="locality-card" data-ticket-id="${ticket.id}" onclick="${isSoldOut ? '' : `selectTicket(${ticket.id})`}" 
               style="border:2px solid var(--border);border-radius:10px;padding:1rem;cursor:${isSoldOut ? 'not-allowed' : 'pointer'};transition:all 0.2s;position:relative;opacity:${isSoldOut ? '0.5' : '1'};">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:0.75rem;">
              <h4 style="font-weight:600;color:var(--blue);margin:0;font-size:1rem;">${ticket.type}</h4>
              <div style="width:80px;height:60px;border-radius:8px;background:${color};"></div>
            </div>
            ${priceHTML}
            <div style="font-size:0.75rem;color:var(--text-light);">
              ${ticket.available} disponibles
              <div style="height:3px;background:var(--border);border-radius:2px;margin-top:0.25rem;overflow:hidden;">
                <div style="height:100%;background:var(--cyan);width:${availabilityPercent}%;transition:width 0.3s;"></div>
              </div>
            </div>
            ${isSoldOut ? '<div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(239,68,68,0.9);color:white;padding:0.5rem 1rem;border-radius:20px;font-weight:700;font-size:0.8rem;">AGOTADO</div>' : ''}
          </div>
        `;
      }).join('');
    }

    window.selectTicket = function(ticketId) {
      selectedTicket = tickets.find(t => t.id === ticketId);
      if (!selectedTicket || selectedTicket.available === 0) return;

      quantity = 1;

      document.querySelectorAll('.locality-card').forEach(card => {
        if (card.dataset.ticketId == ticketId) {
          card.style.borderColor = 'var(--cyan)';
          card.style.background = 'rgba(0, 180, 216, 0.05)';
        } else {
          card.style.borderColor = 'var(--border)';
          card.style.background = 'white';
        }
      });

      document.getElementById('quantitySection').style.display = 'block';
      updateTotal();
    };

    window.increaseQuantity = function() {
      if (!selectedTicket) return;
      if (quantity < selectedTicket.available && quantity < 10) {
        quantity++;
        updateTotal();
      }
    };

    window.decreaseQuantity = function() {
      if (quantity > 1) {
        quantity--;
        updateTotal();
      }
    };

    function updateTotal() {
      if (!selectedTicket) return;

      const price = selectedTicket.final_price || selectedTicket.price;
      const subtotal = price * quantity;
      const fee = Math.round(subtotal * 0.1);
      const total = subtotal + fee;

      document.getElementById('quantityValue').textContent = quantity;
      document.getElementById('subtotal').textContent = formatPrice(subtotal);
      document.getElementById('fee').textContent = formatPrice(fee);
      document.getElementById('total').textContent = formatPrice(total);
      document.getElementById('buyBtn').disabled = false;
    }

    window.proceedToBuy = function() {
      if (!selectedTicket || quantity === 0) return;

      const purchaseData = {
        event: event,
        date: selectedDate,
        ticket: selectedTicket,
        quantity: quantity,
        price: selectedTicket.final_price || selectedTicket.price,
        subtotal: (selectedTicket.final_price || selectedTicket.price) * quantity
      };

      localStorage.setItem('purchase', JSON.stringify(purchaseData));
      window.location.href = '/checkout.html';
    };

    window.openMapModal = function() {
      const modal = document.getElementById('mapModal');
      if (modal) {
        modal.style.display = 'flex';
        document.body.style.overflow = 'hidden';
      }
    };

    window.closeMapModal = function() {
      const modal = document.getElementById('mapModal');
      if (modal) {
        modal.style.display = 'none';
        document.body.style.overflow = '';
      }
    };

    document.addEventListener('DOMContentLoaded', loadEvent);
  </script></body>
</html>
