<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Evento - TuBoleta</title>
  <link rel="stylesheet" href="/src/styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    .event-page { padding-top: 1rem; }
    .event-header { background: var(--blue); padding: 1rem 0; position: sticky; top: 0; z-index: 100; }
    .event-header .container { display: flex; align-items: center; justify-content: space-between; }
    .back-btn { display: flex; align-items: center; gap: 0.5rem; color: var(--white); font-weight: 500; text-decoration: none; }
    .back-btn:hover { color: var(--cyan); }
    .event-hero { position: relative; height: 300px; overflow: hidden; }
    .event-hero img { width: 100%; height: 100%; object-fit: cover; }
    .event-details { padding: 2rem 0; }
    .event-grid { display: grid; grid-template-columns: 1fr; gap: 2rem; }
    .event-info h1 { font-size: 1.75rem; font-weight: 800; color: var(--blue); margin-bottom: 1rem; }
    .event-meta { display: flex; flex-wrap: wrap; gap: 1.5rem; margin-bottom: 1.5rem; }
    .event-meta-item { display: flex; align-items: center; gap: 0.5rem; color: var(--text-light); font-size: 0.9rem; }
    .event-description { color: var(--text-light); line-height: 1.8; margin-bottom: 2rem; }
    
    /* Selector de localidades */
    .localities-section { background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow); padding: 1.5rem; }
    .localities-section h3 { font-size: 1.1rem; font-weight: 700; color: var(--blue); margin-bottom: 1rem; }
    .localities-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
    .locality-card { border: 2px solid var(--border); border-radius: 10px; padding: 1rem; cursor: pointer; transition: all 0.2s; position: relative; }
    .locality-card:hover { border-color: var(--cyan); transform: translateY(-2px); }
    .locality-card.selected { border-color: var(--cyan); background: rgba(0, 180, 216, 0.05); }
    .locality-card.sold-out { opacity: 0.5; cursor: not-allowed; }
    .locality-card.sold-out:hover { transform: none; }
    .locality-color { width: 100%; height: 80px; border-radius: 8px; margin-bottom: 0.75rem; }
    .locality-name { font-weight: 600; color: var(--blue); margin-bottom: 0.5rem; }
    .locality-price { font-weight: 700; color: var(--cyan); font-size: 1.1rem; }
    .locality-availability { font-size: 0.75rem; color: var(--text-light); margin-top: 0.25rem; }
    .sold-out-label { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(239, 68, 68, 0.9); color: white; padding: 0.5rem 1rem; border-radius: 20px; font-weight: 700; font-size: 0.8rem; }
    
    /* Selector de cantidad */
    .quantity-section { border-top: 1px solid var(--border); padding-top: 1.5rem; margin-top: 1.5rem; }
    .quantity-controls { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; }
    .quantity-label { font-weight: 600; color: var(--blue); }
    .quantity-btns { display: flex; align-items: center; gap: 1rem; }
    .quantity-btn { width: 40px; height: 40px; border-radius: 8px; border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 1.25rem; color: var(--blue); background: var(--white); cursor: pointer; font-weight: 700; }
    .quantity-btn:hover { background: var(--gray); border-color: var(--cyan); }
    .quantity-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .quantity-value { font-size: 1.5rem; font-weight: 800; color: var(--blue); min-width: 50px; text-align: center; }
    
    /* Total */
    .total-section { background: var(--gray); border-radius: 10px; padding: 1.25rem; }
    .total-row { display: flex; justify-content: space-between; margin-bottom: 0.75rem; color: var(--text-light); font-size: 0.95rem; }
    .total-row.final { font-size: 1.25rem; font-weight: 800; color: var(--blue); margin-top: 1rem; padding-top: 1rem; border-top: 2px solid var(--border); }
    .total-row.final span:last-child { color: var(--cyan); }
    .buy-btn { width: 100%; padding: 1rem; background: linear-gradient(135deg, var(--yellow) 0%, #f57f17 100%); border: none; border-radius: 10px; color: white; font-size: 1rem; font-weight: 700; cursor: pointer; margin-top: 1rem; }
    .buy-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(249,168,37,0.4); }
    .buy-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    
    .loading { text-align: center; padding: 3rem; color: var(--text-light); }
    .no-localities { text-align: center; padding: 2rem; color: var(--text-light); background: var(--gray); border-radius: 10px; }
    
    /* ============================================
       SECCIÓN DEL PLANO DEL EVENTO (NUEVO)
       ============================================ */
    .event-venue-map {
      margin-top: 2rem;
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1.5rem;
    }
    
    .event-venue-map h3 {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--blue);
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    
    .venue-map-container {
      width: 100%;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    
    .venue-map-container img {
      width: 100%;
      height: auto;
      display: block;
    }
    /* ============================================ */
    
    @media (min-width: 768px) {
      .event-grid { grid-template-columns: 1fr 420px; }
      .event-hero { height: 400px; }
      .event-info h1 { font-size: 2.25rem; }
    }
    /* =====================================================
   SELECTOR DE FECHAS
   ===================================================== */

.event-dates-section {
  background: var(--white);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 1.5rem;
  margin-bottom: 2rem;
}

.event-dates-section h3 {
  font-size: 1.1rem;
  font-weight: 700;
  color: var(--blue);
  margin-bottom: 1rem;
}

.dates-selector {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 1rem;
}

.date-option {
  border: 2px solid var(--border);
  border-radius: 12px;
  padding: 1rem;
  cursor: pointer;
  transition: all 0.2s;
  text-align: center;
}

.date-option:hover {
  border-color: var(--cyan);
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(0, 180, 216, 0.2);
}

.date-option.selected {
  border-color: var(--cyan);
  background: rgba(0, 180, 216, 0.05);
}

.date-option-day {
  font-size: 1.75rem;
  font-weight: 800;
  color: var(--blue);
  line-height: 1;
}

.date-option-month {
  font-size: 0.875rem;
  font-weight: 600;
  color: var(--cyan);
  text-transform: uppercase;
  margin-top: 0.25rem;
}

.date-option-time {
  font-size: 0.875rem;
  color: var(--text-light);
  margin-top: 0.5rem;
}

/* =====================================================
   LOCALIDADES MEJORADAS (GRID)
   ===================================================== */

.localities-section h3 {
  font-size: 1.25rem;
  font-weight: 800;
  color: var(--blue);
  margin-bottom: 1.5rem;
}

.localities-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 1.25rem;
  margin-bottom: 1.5rem;
}

.locality-card {
  border: 2px solid var(--border);
  border-radius: 12px;
  padding: 1.25rem;
  cursor: pointer;
  transition: all 0.3s;
  position: relative;
  background: white;
}

.locality-card:hover {
  border-color: var(--cyan);
  transform: translateY(-4px);
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
}

.locality-card.selected {
  border-color: var(--cyan);
  background: rgba(0, 180, 216, 0.08);
  box-shadow: 0 0 0 2px rgba(0, 180, 216, 0.2);
}

.locality-card.sold-out {
  opacity: 0.5;
  cursor: not-allowed;
  pointer-events: none;
}

.locality-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 1rem;
}

.locality-name {
  font-weight: 700;
  font-size: 1.1rem;
  color: var(--blue);
  margin: 0;
}

.locality-color {
  width: 40px;
  height: 40px;
  border-radius: 8px;
  flex-shrink: 0;
}

.locality-pricing {
  margin-bottom: 0.75rem;
}

.locality-price-original {
  font-size: 0.875rem;
  color: var(--text-light);
  text-decoration: line-through;
  margin-bottom: 0.25rem;
}

.locality-price {
  font-weight: 800;
  color: var(--cyan);
  font-size: 1.5rem;
  line-height: 1;
}

.locality-discount-badge {
  display: inline-block;
  background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
  color: white;
  padding: 0.25rem 0.75rem;
  border-radius: 20px;
  font-size: 0.75rem;
  font-weight: 700;
  margin-left: 0.5rem;
  vertical-align: middle;
}

.locality-availability {
  font-size: 0.85rem;
  color: var(--text-light);
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.locality-availability-bar {
  flex: 1;
  height: 4px;
  background: var(--border);
  border-radius: 2px;
  overflow: hidden;
}

.locality-availability-fill {
  height: 100%;
  background: var(--cyan);
  border-radius: 2px;
  transition: width 0.3s;
}

.sold-out-label {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(239, 68, 68, 0.95);
  color: white;
  padding: 0.75rem 1.5rem;
  border-radius: 30px;
  font-weight: 800;
  font-size: 0.9rem;
  text-transform: uppercase;
  letter-spacing: 1px;
  box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4);
}

/* =====================================================
   BADGE DE DESCUENTO EN IMAGEN DEL EVENTO
   ===================================================== */

.event-hero {
  position: relative;
}

.event-discount-badge {
  position: absolute;
  top: 1.5rem;
  right: 1.5rem;
  background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
  color: white;
  padding: 0.75rem 1.5rem;
  border-radius: 30px;
  font-size: 1.5rem;
  font-weight: 800;
  box-shadow: 0 4px 16px rgba(239, 68, 68, 0.4);
  z-index: 10;
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0%, 100% {
    transform: scale(1);
  }
  50% {
    transform: scale(1.05);
  }
}

.event-discount-badge-promo {
  background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
  box-shadow: 0 4px 16px rgba(245, 158, 11, 0.4);
}

/* =====================================================
   PLANO DEL EVENTO MEJORADO
   ===================================================== */

.event-venue-map {
  margin-top: 2rem;
  background: var(--white);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 1.5rem;
}

.event-venue-map h3 {
  font-size: 1.25rem;
  font-weight: 800;
  color: var(--blue);
  margin-bottom: 1rem;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.venue-map-container {
  width: 100%;
  max-width: 100%;
  border-radius: 12px;
  overflow: hidden;
  border: 2px solid var(--border);
  cursor: zoom-in;
  transition: transform 0.3s;
  position: relative;
}

.venue-map-container:hover {
  transform: scale(1.02);
  border-color: var(--cyan);
}

.venue-map-container img {
  width: 100%;
  height: auto;
  display: block;
}

.map-zoom-hint {
  position: absolute;
  bottom: 1rem;
  right: 1rem;
  background: rgba(26, 58, 74, 0.9);
  color: white;
  padding: 0.5rem 1rem;
  border-radius: 8px;
  font-size: 0.875rem;
  display: flex;
  align-items: center;
  gap: 0.5rem;
  pointer-events: none;
}

/* Modal del plano */
.venue-map-modal {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0, 0, 0, 0.95);
  z-index: 10000;
  align-items: center;
  justify-content: center;
  padding: 2rem;
}

.venue-map-modal.active {
  display: flex;
}

.venue-map-modal-content {
  position: relative;
  max-width: 90vw;
  max-height: 90vh;
  animation: zoomIn 0.3s;
}

@keyframes zoomIn {
  from {
    opacity: 0;
    transform: scale(0.8);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}

.venue-map-modal img {
  max-width: 100%;
  max-height: 90vh;
  border-radius: 8px;
}

.venue-map-modal-close {
  position: absolute;
  top: -3rem;
  right: 0;
  background: white;
  border: none;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.5rem;
  color: var(--blue);
  transition: all 0.2s;
}

.venue-map-modal-close:hover {
  background: var(--cyan);
  color: white;
  transform: rotate(90deg);
}

/* =====================================================
   RESPONSIVE
   ===================================================== */

@media (max-width: 768px) {
  .localities-grid {
    grid-template-columns: 1fr;
    gap: 1rem;
  }

  .dates-selector {
    grid-template-columns: 1fr;
  }

  .event-discount-badge {
    font-size: 1.25rem;
    padding: 0.5rem 1rem;
    top: 1rem;
    right: 1rem;
  }

  .venue-map-container {
    border-radius: 8px;
  }

  .venue-map-modal-content {
    max-width: 95vw;
    padding: 1rem;
  }

  .locality-card {
    padding: 1rem;
  }

  .locality-name {
    font-size: 1rem;
  }

  .locality-price {
    font-size: 1.25rem;
  }
}

@media (max-width: 480px) {
  .locality-color {
    width: 32px;
    height: 32px;
  }

  .event-venue-map {
    padding: 1rem;
  }

  .event-dates-section {
    padding: 1rem;
  }
}

/* =====================================================
   MEJORAS ADICIONALES
   ===================================================== */

.quantity-section {
  border-top: 2px solid var(--border);
  padding-top: 1.5rem;
  margin-top: 1.5rem;
}

.total-section {
  background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
  border: 2px solid var(--border);
  border-radius: 12px;
  padding: 1.5rem;
}

.buy-btn {
  background: linear-gradient(135deg, var(--yellow) 0%, #f57f17 100%);
  box-shadow: 0 4px 12px rgba(249, 168, 37, 0.3);
  transition: all 0.3s;
}

.buy-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(249, 168, 37, 0.4);
}
  </style>
</head>
<body>
  <header class="event-header">
    <div class="container">
      <a href="/" class="back-btn">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <path d="M12.5 15L7.5 10L12.5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Volver
       <a href="/" class="logo">
  <img src="public/logos/tuboleta-logo.png" alt="Tuboleta" style="height:35px;width:auto;" />
</a>
    </div>
  </header>

  <div id="eventContent" class="loading">
    Cargando evento...
  </div>

  <script type="module">
    import { eventsApi, ticketsApi, eventDatesApi, formatPrice, calculateDiscount, getDiscountBadgeText } from './supabase.ts';

// Estado global
let currentEvent = null;
let selectedDate = null;
let selectedLocality = null;
let quantity = 1;
let availableTickets = [];

// ============================================
// CARGAR DATOS DEL EVENTO
// ============================================

async function loadEvent() {
  const urlParams = new URLSearchParams(window.location.search);
  const eventId = parseInt(urlParams.get('id'));

  if (!eventId) {
    window.location.href = '/';
    return;
  }

  try {
    // Cargar evento
    currentEvent = await eventsApi.getById(eventId);
    if (!currentEvent) {
      throw new Error('Evento no encontrado');
    }

    // Cargar fechas disponibles
    const dates = await eventDatesApi.getByEventId(eventId);

    // Renderizar evento
    renderEvent(currentEvent, dates);

    // Si solo hay una fecha, seleccionarla automáticamente
    if (dates.length === 1) {
      selectedDate = dates[0];
      await loadTickets(dates[0].id);
    } else if (dates.length > 1) {
      renderDateSelector(dates);
    } else {
      // No hay fechas, usar tickets sin fecha
      await loadTickets(null);
    }

  } catch (error) {
    console.error('Error cargando evento:', error);
    document.getElementById('event-content').innerHTML = `
      <div style="text-align:center;padding:3rem;">
        <p style="color:#ef4444;font-size:1.1rem;">Error al cargar el evento</p>
        <a href="/" style="color:var(--cyan);text-decoration:none;margin-top:1rem;display:inline-block;">← Volver al inicio</a>
      </div>
    `;
  }
}

// ============================================
// RENDERIZAR EVENTO
// ============================================

function renderEvent(event, dates) {
  // Hero image con badge de descuento
  let discountBadge = '';
  if (event.has_discount) {
    const badgeText = getDiscountBadgeText(event.discount_type || 'percentage', event.discount_value || 0);
    const badgeClass = event.discount_type === 'percentage' ? '' : 'event-discount-badge-promo';
    discountBadge = `<div class="event-discount-badge ${badgeClass}">${badgeText}</div>`;
  }

  document.querySelector('.event-hero').innerHTML = `
    ${discountBadge}
    <img src="${event.image}" alt="${event.title}">
  `;

  // Título y meta
  document.querySelector('.event-info h1').textContent = event.title;

  const metaHTML = `
    <div class="event-meta-item">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
        <circle cx="12" cy="10" r="3"/>
      </svg>
      ${event.venue}, ${event.city}
    </div>
    ${dates.length <= 1 ? `
      <div class="event-meta-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
          <line x1="16" y1="2" x2="16" y2="6"/>
          <line x1="8" y1="2" x2="8" y2="6"/>
          <line x1="3" y1="10" x2="21" y2="10"/>
        </svg>
        ${event.date_full}
      </div>
      <div class="event-meta-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <polyline points="12 6 12 12 16 14"/>
        </svg>
        ${event.time}
      </div>
    ` : `
      <div class="event-meta-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
          <line x1="16" y1="2" x2="16" y2="6"/>
          <line x1="8" y1="2" x2="8" y2="6"/>
          <line x1="3" y1="10" x2="21" y2="10"/>
        </svg>
        ${dates.length} fechas disponibles
      </div>
    `}
  `;

  document.querySelector('.event-meta').innerHTML = metaHTML;

  if (event.description) {
    document.querySelector('.event-description').textContent = event.description;
  }

  // Plano del evento
  if (event.venue_map) {
    renderVenueMap(event.venue_map);
  }
}

// ============================================
// SELECTOR DE FECHAS
// ============================================

function renderDateSelector(dates) {
  const container = document.getElementById('localities-container');
  
  const datesHTML = `
    <div class="event-dates-section">
      <h3>📅 Selecciona una fecha</h3>
      <div class="dates-selector">
        ${dates.map((date, index) => {
          const dateObj = new Date(date.event_date + 'T00:00:00');
          const day = dateObj.getDate();
          const month = dateObj.toLocaleDateString('es-ES', { month: 'short' }).toUpperCase();
          
          return `
            <div class="date-option ${index === 0 ? 'selected' : ''}" onclick="selectDate(${date.id}, ${index})">
              <div class="date-option-day">${day}</div>
              <div class="date-option-month">${month}</div>
              <div class="date-option-time">⏰ ${date.event_time}</div>
            </div>
          `;
        }).join('')}
      </div>
    </div>
  `;

  container.insertAdjacentHTML('beforebegin', datesHTML);

  // Seleccionar primera fecha automáticamente
  if (dates.length > 0) {
    window.selectDate(dates[0].id, 0);
  }
}

window.selectDate = async function(dateId, index) {
  // Actualizar UI
  document.querySelectorAll('.date-option').forEach((el, i) => {
    el.classList.toggle('selected', i === index);
  });

  // Cargar tickets de esta fecha
  const dates = await eventDatesApi.getByEventId(currentEvent.id);
  selectedDate = dates.find(d => d.id === dateId);
  
  await loadTickets(dateId);
};

// ============================================
// CARGAR LOCALIDADES
// ============================================

async function loadTickets(eventDateId) {
  try {
    if (eventDateId) {
      availableTickets = await ticketsApi.getByEventDateId(eventDateId);
    } else {
      availableTickets = await ticketsApi.getByEventId(currentEvent.id);
    }

    renderLocalities();
  } catch (error) {
    console.error('Error cargando localidades:', error);
  }
}

// ============================================
// RENDERIZAR LOCALIDADES
// ============================================

function renderLocalities() {
  const container = document.getElementById('localities-grid');

  if (availableTickets.length === 0) {
    container.innerHTML = `
      <div class="no-localities">
        No hay localidades disponibles para esta fecha
      </div>
    `;
    return;
  }

  container.innerHTML = availableTickets.map(ticket => {
    const isSoldOut = ticket.available === 0;
    const availabilityPercent = (ticket.available / ticket.quantity) * 100;
    
    // Calcular precio con descuento
    let priceHTML;
    if (ticket.has_discount) {
      const result = calculateDiscount(
        ticket.price,
        ticket.discount_type || 'percentage',
        ticket.discount_value || 0
      );
      
      const badgeText = ticket.discount_type === 'percentage' 
        ? `-${Math.round(ticket.discount_value)}%` 
        : 'PROMO';

      priceHTML = `
        <div class="locality-pricing">
          <div class="locality-price-original">${formatPrice(result.originalPrice)}</div>
          <div>
            <span class="locality-price">${formatPrice(result.finalPrice)}</span>
            <span class="locality-discount-badge">${badgeText}</span>
          </div>
        </div>
      `;
    } else {
      priceHTML = `
        <div class="locality-pricing">
          <div class="locality-price">${formatPrice(ticket.final_price || ticket.price)}</div>
        </div>
      `;
    }

    return `
      <div class="locality-card ${isSoldOut ? 'sold-out' : ''}" onclick="selectLocality(${ticket.id})">
        <div class="locality-header">
          <h4 class="locality-name">${ticket.type}</h4>
          <div class="locality-color" style="background: ${getColorForType(ticket.type)};"></div>
        </div>
        ${priceHTML}
        <div class="locality-availability">
          <span>${ticket.available} disponibles</span>
          <div class="locality-availability-bar">
            <div class="locality-availability-fill" style="width: ${availabilityPercent}%;"></div>
          </div>
        </div>
        ${isSoldOut ? '<div class="sold-out-label">AGOTADO</div>' : ''}
      </div>
    `;
  }).join('');
}

// ============================================
// SELECCIONAR LOCALIDAD
// ============================================

window.selectLocality = function(ticketId) {
  const ticket = availableTickets.find(t => t.id === ticketId);
  if (!ticket || ticket.available === 0) return;

  selectedLocality = ticket;
  quantity = 1;

  // Actualizar UI
  document.querySelectorAll('.locality-card').forEach(card => {
    card.classList.remove('selected');
  });
  event.currentTarget?.classList.add('selected');

  // Mostrar sección de cantidad
  document.getElementById('quantity-section').style.display = 'block';
  updateTotal();
};

// ============================================
// CONTROLES DE CANTIDAD
// ============================================

window.increaseQuantity = function() {
  if (!selectedLocality) return;
  if (quantity < selectedLocality.available && quantity < 10) {
    quantity++;
    updateTotal();
  }
};

window.decreaseQuantity = function() {
  if (quantity > 1) {
    quantity--;
    updateTotal();
  }
};

// ============================================
// ACTUALIZAR TOTAL
// ============================================

function updateTotal() {
  if (!selectedLocality) return;

  const price = selectedLocality.final_price || selectedLocality.price;
  const subtotal = price * quantity;
  const fee = Math.round(subtotal * 0.1);
  const total = subtotal + fee;

  document.getElementById('quantity-value').textContent = quantity;
  document.getElementById('subtotal').textContent = formatPrice(subtotal);
  document.getElementById('fee').textContent = formatPrice(fee);
  document.getElementById('total').textContent = formatPrice(total);
  
  // Habilitar botón de compra
  document.getElementById('buy-btn').disabled = false;
}

// ============================================
// COMPRAR
// ============================================

window.buyTickets = function() {
  if (!selectedLocality || quantity === 0) return;

  const purchaseData = {
    event: currentEvent,
    date: selectedDate,
    ticket: selectedLocality,
    quantity: quantity,
    price: selectedLocality.final_price || selectedLocality.price,
    subtotal: (selectedLocality.final_price || selectedLocality.price) * quantity
  };

  localStorage.setItem('purchase', JSON.stringify(purchaseData));
  window.location.href = '/checkout.html';
};

// ============================================
// PLANO DEL EVENTO
// ============================================

function renderVenueMap(mapUrl) {
  const container = document.querySelector('.event-info');
  
  const mapHTML = `
    <div class="event-venue-map">
      <h3>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
          <circle cx="12" cy="10" r="3"/>
        </svg>
        Plano del evento
      </h3>
      <div class="venue-map-container" onclick="openMapModal('${mapUrl}')">
        <img src="${mapUrl}" alt="Plano del evento">
        <div class="map-zoom-hint">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/>
            <path d="M21 21l-4.35-4.35"/>
            <line x1="11" y1="8" x2="11" y2="14"/>
            <line x1="8" y1="11" x2="14" y2="11"/>
          </svg>
          Click para ampliar
        </div>
      </div>
    </div>
  `;

  container.insertAdjacentHTML('beforeend', mapHTML);

  // Crear modal
  const modalHTML = `
    <div class="venue-map-modal" id="mapModal" onclick="closeMapModal()">
      <div class="venue-map-modal-content" onclick="event.stopPropagation()">
        <button class="venue-map-modal-close" onclick="closeMapModal()">×</button>
        <img src="${mapUrl}" alt="Plano del evento">
      </div>
    </div>
  `;

  document.body.insertAdjacentHTML('beforeend', modalHTML);
}

window.openMapModal = function(mapUrl) {
  document.getElementById('mapModal')?.classList.add('active');
  document.body.style.overflow = 'hidden';
};

window.closeMapModal = function() {
  document.getElementById('mapModal')?.classList.remove('active');
  document.body.style.overflow = '';
};

// ============================================
// HELPERS
// ============================================

function getColorForType(type) {
  const colors = {
    'General': 'linear-gradient(135deg, #60a5fa 0%, #3b82f6 100%)',
    'VIP': 'linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%)',
    'Platea': 'linear-gradient(135deg, #a78bfa 0%, #8b5cf6 100%)',
    'Preferencial': 'linear-gradient(135deg, #34d399 0%, #10b981 100%)'
  };
  return colors[type] || 'linear-gradient(135deg, #94a3b8 0%, #64748b 100%)';
}

// ============================================
// INICIALIZAR
// ============================================

document.addEventListener('DOMContentLoaded', loadEvent);

</script>
