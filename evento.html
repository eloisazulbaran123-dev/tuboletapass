<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Evento - TuBoleta</title>
  <link rel="stylesheet" href="/src/styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    .event-page { padding-top: 1rem; }
    .event-header { background: var(--blue); padding: 1rem 0; position: sticky; top: 0; z-index: 100; }
    .event-header .container { display: flex; align-items: center; justify-content: space-between; }
    .back-btn { display: flex; align-items: center; gap: 0.5rem; color: var(--white); font-weight: 500; text-decoration: none; }
    .back-btn:hover { color: var(--cyan); }
    
    /* NUEVO LAYOUT */
    .event-container { max-width: 1400px; margin: 0 auto; padding: 2rem 1rem; }
    .event-layout { display: grid; grid-template-columns: 1fr; gap: 2rem; }
    
    /* COLUMNA IZQUIERDA */
    .event-main {
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }
    
    .event-image-wrapper {
      position: relative;
      width: 100%;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }
    
    .event-image-wrapper img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
    }
    
    .event-content {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    
    .event-title {
      font-size: 2rem;
      font-weight: 800;
      color: var(--blue);
      line-height: 1.2;
      margin: 0;
    }
    
    .event-meta { 
      display: flex; 
      flex-wrap: wrap; 
      gap: 1.5rem; 
    }
    
    .event-meta-item { 
      display: flex; 
      align-items: center; 
      gap: 0.5rem; 
      color: var(--text-light); 
      font-size: 0.9rem; 
    }
    
    .event-description { 
      color: var(--text-light); 
      line-height: 1.8; 
      font-size: 1rem;
    }
    
    .event-venue-map {
      margin-top: 1rem;
    }
    
    .event-venue-map h3 {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--blue);
      margin-bottom: 1rem;
    }
    
    .venue-map-container {
      position: relative;
      cursor: zoom-in;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid var(--border);
      transition: transform 0.3s;
    }
    
    .venue-map-container:hover {
      transform: scale(1.02);
    }
    
    .venue-map-container img {
      width: 100%;
      height: auto;
      display: block;
    }
    
    .map-zoom-hint {
      position: absolute;
      bottom: 1rem;
      right: 1rem;
      background: rgba(26,58,74,0.95);
      color: white;
      padding: 0.75rem 1.25rem;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 600;
      pointer-events: none;
    }
    
    /* COLUMNA DERECHA - SIDEBAR */
    .event-sidebar {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    
    .sidebar-card {
      background: white;
      border-radius: 16px;
      padding: 1.5rem;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }
    
    .sidebar-card h3 {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--blue);
      margin: 0 0 1rem 0;
    }
    
    /* Selector de localidades */
    .localities-grid { 
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    
    .locality-card { 
      border: 2px solid var(--border); 
      border-radius: 12px; 
      padding: 1rem; 
      cursor: pointer; 
      transition: all 0.2s; 
      position: relative;
      background: white;
    }
    
    .locality-card:hover:not(.sold-out) { 
      border-color: var(--cyan); 
      transform: translateX(4px);
      box-shadow: 0 4px 12px rgba(0,180,216,0.15);
    }
    
    .locality-card.selected { 
      border-color: var(--cyan); 
      background: rgba(0, 180, 216, 0.05);
      box-shadow: 0 0 0 2px rgba(0,180,216,0.2);
    }
    
    .locality-card.sold-out { 
      opacity: 0.5; 
      cursor: not-allowed; 
    }
    
    .locality-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
    }
    
    .locality-name {
      font-weight: 700;
      font-size: 1rem;
      color: var(--blue);
      margin: 0;
    }
    
    /* Color eliminado - ya no se usa */
    
    .locality-price { 
      font-weight: 700; 
      color: var(--cyan); 
      font-size: 1.25rem;
      margin-bottom: 0.5rem;
    }
    
    .locality-price-original {
      font-size: 0.875rem;
      color: #999;
      text-decoration: line-through;
      margin-bottom: 0.25rem;
    }
    
    .locality-discount-badge {
      display: inline-block;
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: white;
      padding: 0.25rem 0.5rem;
      border-radius: 12px;
      font-size: 0.7rem;
      font-weight: 700;
      margin-left: 0.5rem;
    }
    
    .locality-availability { 
      font-size: 0.8rem; 
      color: var(--text-light);
    }
    
    .locality-availability-bar {
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
      margin-top: 0.5rem;
    }
    
    .locality-availability-fill {
      height: 100%;
      background: var(--cyan);
      transition: width 0.3s;
    }
    
    .sold-out-label { 
      position: absolute; 
      top: 50%; 
      left: 50%; 
      transform: translate(-50%, -50%); 
      background: rgba(239, 68, 68, 0.95); 
      color: white; 
      padding: 0.5rem 1rem; 
      border-radius: 20px; 
      font-weight: 700; 
      font-size: 0.8rem;
      pointer-events: none;
    }
    
    /* Selector de cantidad */
    .quantity-section { border-top: 1px solid var(--border); padding-top: 1.5rem; margin-top: 1.5rem; }
    .quantity-controls { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; }
    .quantity-label { font-weight: 600; color: var(--blue); }
    .quantity-btns { display: flex; align-items: center; gap: 1rem; }
    .quantity-btn { width: 40px; height: 40px; border-radius: 8px; border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 1.25rem; color: var(--blue); background: var(--white); cursor: pointer; font-weight: 700; }
    .quantity-btn:hover { background: var(--gray); border-color: var(--cyan); }
    .quantity-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .quantity-value { font-size: 1.5rem; font-weight: 800; color: var(--blue); min-width: 50px; text-align: center; }
    
    /* Total */
    .total-section { background: var(--gray); border-radius: 10px; padding: 1.25rem; }
    .total-row { display: flex; justify-content: space-between; margin-bottom: 0.75rem; color: var(--text-light); font-size: 0.95rem; }
    .total-row.final { font-size: 1.25rem; font-weight: 800; color: var(--blue); margin-top: 1rem; padding-top: 1rem; border-top: 2px solid var(--border); }
    .total-row.final span:last-child { color: var(--cyan); }
    .buy-btn { width: 100%; padding: 1rem; background: linear-gradient(135deg, var(--yellow) 0%, #f57f17 100%); border: none; border-radius: 10px; color: white; font-size: 1rem; font-weight: 700; cursor: pointer; margin-top: 1rem; }
    .buy-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(249,168,37,0.4); }
    .buy-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    
    .loading { text-align: center; padding: 3rem; color: var(--text-light); }
    .no-localities { text-align: center; padding: 2rem; color: var(--text-light); background: var(--gray); border-radius: 10px; }
    
    /* ============================================
       SECCIÓN DEL PLANO DEL EVENTO (NUEVO)
       ============================================ */
    .event-venue-map {
      margin-top: 2rem;
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1.5rem;
    }
    
    .event-venue-map h3 {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--blue);
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    
    .venue-map-container {
      width: 100%;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    
    .venue-map-container img {
      width: 100%;
      height: auto;
      display: block;
    }
    /* ============================================ */
    
    /* Badge de descuento en imagen */
    .event-discount-badge {
      position: absolute;
      top: 1.5rem;
      right: 1.5rem;
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      color: white;
      padding: 0.75rem 1.5rem;
      border-radius: 30px;
      font-size: 1.5rem;
      font-weight: 800;
      box-shadow: 0 4px 16px rgba(239, 68, 68, 0.4);
      z-index: 10;
    }
    
    /* Badge descuento */
    .event-discount-badge {
      position: absolute;
      top: 1.5rem;
      right: 1.5rem;
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: white;
      padding: 0.75rem 1.5rem;
      border-radius: 30px;
      font-size: 1.5rem;
      font-weight: 800;
      box-shadow: 0 4px 16px rgba(239,68,68,0.4);
      z-index: 10;
    }
    
    @media (min-width: 1024px) {
      .event-layout {
        grid-template-columns: 1fr 400px;
      }
      
      .event-title {
        font-size: 2.5rem;
      }
      
      .event-sidebar {
        position: sticky;
        top: 100px;
        align-self: start;
      }
    }
    
    @media (max-width: 768px) {
      .event-container {
        padding: 1rem;
      }
      
      .event-title {
        font-size: 1.75rem;
      }
      
      .event-discount-badge {
        font-size: 1.25rem;
        padding: 0.5rem 1rem;
        top: 1rem;
        right: 1rem;
      }
      
      .sidebar-card {
        padding: 1.25rem;
      }
    }
  </style>
</head>
<body>
  <header class="event-header">
    <div class="container">
      <a href="/" class="back-btn">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <path d="M12.5 15L7.5 10L12.5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Volver
       <a href="/" class="logo">
  <img src="public/logos/tuboleta-logo.png" alt="Tuboleta" style="height:35px;width:auto;" />
</a>
    </div>
  </header>

  <div id="eventContent" class="loading">
    Cargando evento...
  </div>

  <script type="module">
    import { eventsApi, ticketsApi, formatPrice, eventDatesApi, calculateDiscount, getDiscountBadgeText } from '/src/supabase.ts';

    const urlParams = new URLSearchParams(window.location.search);
    const eventId = parseInt(urlParams.get('id'));

    let event = null;
    let tickets = [];
    let selectedTicket = null;
    let quantity = 1;
    let selectedDate = null;
    let availableDates = [];

    async function loadEvent() {
      try {
        if (!eventId) {
          alert('ID de evento no válido');
          window.location.href = '/';
          return;
        }

        event = await eventsApi.getById(eventId);
        
        if (!event) {
          alert('Evento no encontrado');
          window.location.href = '/';
          return;
        }

        // Cargar fechas si la API está disponible
        try {
          availableDates = await eventDatesApi.getByEventId(eventId);
        } catch (error) {
          console.log('No hay fechas múltiples');
          availableDates = [];
        }

        // Cargar tickets
        try {
          tickets = await ticketsApi.getByEventId(eventId);
          console.log('Tickets cargados:', tickets);
        } catch (error) {
          console.error('Error al cargar tickets:', error);
          tickets = [];
        }

        renderEvent();
        renderDatesIfMultiple();
        renderTickets();

      } catch (error) {
        console.error('Error al cargar evento:', error);
        document.getElementById('eventContent').innerHTML = `
          <div style="text-align:center;padding:3rem;">
            <p style="color:#ef4444;font-size:1.1rem;">Error al cargar el evento</p>
            <a href="/" style="color:var(--cyan);text-decoration:none;margin-top:1rem;display:inline-block;">← Volver al inicio</a>
          </div>
        `;
      }
    }

    function renderEvent() {
      document.title = event.title + ' - TuBoleta';

      // Badge de descuento
      let discountBadge = '';
      if (event.has_discount) {
        try {
          const badgeText = getDiscountBadgeText(event.discount_type || 'percentage', event.discount_value || 0);
          discountBadge = `
            <div style="position:absolute;top:1.5rem;right:1.5rem;background:linear-gradient(135deg,#ef4444,#dc2626);color:white;padding:0.75rem 1.5rem;border-radius:30px;font-size:1.5rem;font-weight:800;box-shadow:0 4px 16px rgba(239,68,68,0.4);z-index:10;">
              ${badgeText}
            </div>
          `;
        } catch (e) {
          console.log('Error generando badge');
        }
      }

      const html = `
        <div class="event-container">
          <div class="event-layout">
            
            <!-- COLUMNA IZQUIERDA -->
            <div class="event-main">
              
              <!-- Imagen del evento -->
              <div class="event-image-wrapper">
                ${discountBadge}
                <img src="${event.image}" alt="${event.title}">
              </div>
              
              <!-- Contenido del evento -->
              <div class="event-content">
                <h1 class="event-title">${event.title}</h1>
                
                <div class="event-meta">
                  <div class="event-meta-item">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <rect x="3" y="4" width="18" height="18" rx="2"/>
                      <line x1="16" y1="2" x2="16" y2="6"/>
                      <line x1="8" y1="2" x2="8" y2="6"/>
                      <line x1="3" y1="10" x2="21" y2="10"/>
                    </svg>
                    <span>${event.date_full}</span>
                  </div>
                  <div class="event-meta-item">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <circle cx="12" cy="12" r="10"/>
                      <polyline points="12 6 12 12 16 14"/>
                    </svg>
                    <span>${event.time}</span>
                  </div>
                  <div class="event-meta-item">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
                      <circle cx="12" cy="10" r="3"/>
                    </svg>
                    <span>${event.venue}, ${event.city}</span>
                  </div>
                </div>
                
                ${event.description ? `<p class="event-description">${event.description}</p>` : ''}
                
                ${event.venue_map ? `
                  <div class="event-venue-map">
                    <h3>
                      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
                        <circle cx="12" cy="10" r="3"/>
                      </svg>
                      Plano del Evento
                    </h3>
                    <div class="venue-map-container" onclick="openMapModal()">
                      <img src="${event.venue_map}" alt="Plano de ${event.venue}" loading="lazy">
                      <div class="map-zoom-hint">
                        🔍 Click para ampliar
                      </div>
                    </div>
                  </div>
                ` : ''}
              </div>
            </div>
            
            <!-- COLUMNA DERECHA - SIDEBAR -->
            <div class="event-sidebar">
              
              <!-- Selector de fechas -->
              <div id="dates-selector-container"></div>
              
              <!-- Localidades -->
              <div class="sidebar-card">
                <h3>Selecciona una localidad</h3>
                <div class="localities-grid" id="localitiesGrid"></div>
                
                <div class="quantity-section" id="quantitySection" style="display:none;border-top:1px solid var(--border);padding-top:1.5rem;margin-top:1.5rem;">
                  <div class="quantity-controls">
                    <span class="quantity-label">Cantidad</span>
                    <div class="quantity-btns">
                      <button class="quantity-btn" onclick="decreaseQuantity()">−</button>
                      <span class="quantity-value" id="quantityValue">1</span>
                      <button class="quantity-btn" onclick="increaseQuantity()">+</button>
                    </div>
                  </div>
                  
                  <div class="total-section">
                    <div class="total-row"><span>Subtotal</span><span id="subtotal">$0</span></div>
                    <div class="total-row"><span>Servicio (10%)</span><span id="fee">$0</span></div>
                    <div class="total-row final"><span>Total</span><span id="total">$0</span></div>
                  </div>
                  
                  <button class="buy-btn" onclick="proceedToBuy()" disabled id="buyBtn">
                    Comprar boletas
                  </button>
                </div>
              </div>
            </div>
            
          </div>
        </div>

        ${event.venue_map ? `
          <div id="mapModal" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.95);z-index:10000;align-items:center;justify-content:center;padding:2rem;" onclick="closeMapModal()">
            <div style="position:relative;max-width:90vw;max-height:90vh;" onclick="event.stopPropagation()">
              <button onclick="closeMapModal()" style="position:absolute;top:-3rem;right:0;background:white;border:none;width:40px;height:40px;border-radius:50%;cursor:pointer;font-size:1.5rem;">×</button>
              <img src="${event.venue_map}" alt="Plano" style="max-width:100%;max-height:90vh;border-radius:8px;">
            </div>
          </div>
        ` : ''}
      `;

      document.getElementById('eventContent').innerHTML = html;
    }

    function renderDatesIfMultiple() {
      if (!availableDates || availableDates.length <= 1) return;

      const container = document.getElementById('dates-selector-container');
      if (!container) return;

      const datesHTML = `
        <div class="sidebar-card">
          <h3>📅 Selecciona una fecha</h3>
          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:0.75rem;">
            ${availableDates.map((date, index) => {
              const dateObj = new Date(date.event_date + 'T00:00:00');
              const day = dateObj.getDate();
              const month = dateObj.toLocaleDateString('es-ES', { month: 'short' }).toUpperCase();
              
              return `
                <div class="date-option" data-date-id="${date.id}" onclick="selectDate(${date.id})" 
                     style="border:2px solid ${index === 0 ? 'var(--cyan)' : 'var(--border)'};background:${index === 0 ? 'rgba(0,180,216,0.05)' : 'white'};border-radius:12px;padding:1rem;cursor:pointer;text-align:center;transition:all 0.3s;">
                  <div style="font-size:1.75rem;font-weight:800;color:var(--blue);line-height:1;">${day}</div>
                  <div style="font-size:0.875rem;font-weight:600;color:var(--cyan);margin-top:0.25rem;">${month}</div>
                  <div style="font-size:0.875rem;color:#666;margin-top:0.5rem;">⏰ ${date.event_time}</div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;

      container.innerHTML = datesHTML;
      
      if (availableDates.length > 0) {
        selectedDate = availableDates[0];
        loadTicketsByDate(availableDates[0].id);
      }
    }

    window.selectDate = async function(dateId) {
      selectedDate = availableDates.find(d => d.id === dateId);
      
      document.querySelectorAll('.date-option').forEach(el => {
        if (el.dataset.dateId == dateId) {
          el.style.borderColor = 'var(--cyan)';
          el.style.background = 'rgba(0,180,216,0.05)';
        } else {
          el.style.borderColor = 'var(--border)';
          el.style.background = 'white';
        }
      });

      await loadTicketsByDate(dateId);
    };

    async function loadTicketsByDate(dateId) {
      // Las localidades son las mismas para todas las fechas
      // Solo cargamos por evento, no por fecha específica
      try {
        tickets = await ticketsApi.getByEventId(eventId);
        console.log('Localidades cargadas:', tickets);
        renderTickets();
      } catch (error) {
        console.error('Error cargando tickets:', error);
      }
    }

    function renderTickets() {
      const container = document.getElementById('localitiesGrid');
      if (!container) return;

      if (!tickets || tickets.length === 0) {
        container.innerHTML = '<div style="text-align:center;padding:2rem;color:var(--text-light);background:var(--gray);border-radius:10px;">No hay localidades disponibles</div>';
        return;
      }

      const colors = {
        'General': 'linear-gradient(135deg, #60a5fa 0%, #3b82f6 100%)',
        'VIP': 'linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%)',
        'Platea': 'linear-gradient(135deg, #a78bfa 0%, #8b5cf6 100%)',
        'Preferencial': 'linear-gradient(135deg, #34d399 0%, #10b981 100%)'
      };

      container.innerHTML = tickets.map(ticket => {
        const isSoldOut = ticket.available === 0;
        const availabilityPercent = Math.round((ticket.available / ticket.quantity) * 100);
        const color = colors[ticket.type] || 'linear-gradient(135deg, #94a3b8 0%, #64748b 100%)';
        
        let priceHTML = '';
        if (ticket.has_discount) {
          try {
            const result = calculateDiscount(ticket.price, ticket.discount_type || 'percentage', ticket.discount_value || 0);
            const badgeText = ticket.discount_type === 'percentage' ? `-${Math.round(ticket.discount_value)}%` : 'PROMO';
            
            priceHTML = `
              <div>
                <div class="locality-price-original">${formatPrice(result.originalPrice)}</div>
                <div style="display:flex;align-items:center;gap:0.5rem;">
                  <span class="locality-price">${formatPrice(result.finalPrice)}</span>
                  <span class="locality-discount-badge">${badgeText}</span>
                </div>
              </div>
            `;
          } catch (e) {
            priceHTML = `<div class="locality-price">${formatPrice(ticket.price)}</div>`;
          }
        } else {
          priceHTML = `<div class="locality-price">${formatPrice(ticket.final_price || ticket.price)}</div>`;
        }

        return `
          <div class="locality-card ${isSoldOut ? 'sold-out' : ''}" data-ticket-id="${ticket.id}" onclick="${isSoldOut ? '' : `selectTicket(${ticket.id})`}">
            <div class="locality-header">
              <h4 class="locality-name">${ticket.type}</h4>
            </div>
            ${priceHTML}
            <div class="locality-availability">
              ${ticket.available} disponibles
              <div class="locality-availability-bar">
                <div class="locality-availability-fill" style="width:${availabilityPercent}%;"></div>
              </div>
            </div>
            ${isSoldOut ? '<div class="sold-out-label">AGOTADO</div>' : ''}
          </div>
        `;
      }).join('');
    }

    window.selectTicket = function(ticketId) {
      selectedTicket = tickets.find(t => t.id === ticketId);
      if (!selectedTicket || selectedTicket.available === 0) return;

      quantity = 1;

      document.querySelectorAll('.locality-card').forEach(card => {
        if (card.dataset.ticketId == ticketId) {
          card.style.borderColor = 'var(--cyan)';
          card.style.background = 'rgba(0, 180, 216, 0.05)';
        } else {
          card.style.borderColor = 'var(--border)';
          card.style.background = 'white';
        }
      });

      document.getElementById('quantitySection').style.display = 'block';
      updateTotal();
    };

    window.increaseQuantity = function() {
      if (!selectedTicket) return;
      if (quantity < selectedTicket.available && quantity < 10) {
        quantity++;
        updateTotal();
      }
    };

    window.decreaseQuantity = function() {
      if (quantity > 1) {
        quantity--;
        updateTotal();
      }
    };

    function updateTotal() {
      if (!selectedTicket) return;

      const price = selectedTicket.final_price || selectedTicket.price;
      const subtotal = price * quantity;
      const fee = Math.round(subtotal * 0.1);
      const total = subtotal + fee;

      document.getElementById('quantityValue').textContent = quantity;
      document.getElementById('subtotal').textContent = formatPrice(subtotal);
      document.getElementById('fee').textContent = formatPrice(fee);
      document.getElementById('total').textContent = formatPrice(total);
      document.getElementById('buyBtn').disabled = false;
    }

    window.proceedToBuy = function() {
      console.log('🛒 Intentando comprar...');
      console.log('Ticket seleccionado:', selectedTicket);
      console.log('Cantidad:', quantity);
      console.log('Evento:', event);
      
      if (!selectedTicket) {
        alert('Por favor selecciona una localidad primero');
        return;
      }
      
      if (quantity === 0) {
        alert('La cantidad debe ser mayor a 0');
        return;
      }

      const purchaseData = {
        event: event,
        date: selectedDate,
        ticket: selectedTicket,
        quantity: quantity,
        price: selectedTicket.final_price || selectedTicket.price,
        subtotal: (selectedTicket.final_price || selectedTicket.price) * quantity
      };

      console.log('💾 Guardando en localStorage:', purchaseData);
      
      try {
        localStorage.setItem('purchase', JSON.stringify(purchaseData));
        console.log('✅ Guardado exitoso');
        console.log('📦 Verificación:', localStorage.getItem('purchase'));
        window.location.href = '/checkout.html';
      } catch (error) {
        console.error('❌ Error guardando en localStorage:', error);
        alert('Error al procesar la compra. Por favor intenta de nuevo.');
      }
    };

    window.openMapModal = function() {
      const modal = document.getElementById('mapModal');
      if (modal) {
        modal.style.display = 'flex';
        document.body.style.overflow = 'hidden';
      }
    };

    window.closeMapModal = function() {
      const modal = document.getElementById('mapModal');
      if (modal) {
        modal.style.display = 'none';
        document.body.style.overflow = '';
      }
    };

    document.addEventListener('DOMContentLoaded', loadEvent);
  </script></body>
</html>
